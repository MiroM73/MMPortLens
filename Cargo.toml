[package]
name = "mmportlens"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "A TCPView-style viewer of network connections"
repository = "https://github.com/MiroM73/MMPortLens"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sys-locale = "0.3"
regex = "1"
sha2 = "0.11"
flate2 = "1"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1"
